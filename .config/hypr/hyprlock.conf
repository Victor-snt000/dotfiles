general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

# Hora
label {
    monitor =
    text = $TIME
    color = rgba(235, 235, 235, 1.0)
    font_size = 96
    font_family = Adwaita Sans
    position = 0, 160
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(140, 140, 140, 1.0)
    font_size = 18
    font_family = Adwaita Sans
    position = 0, 80
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 260, 48
    outline_thickness = 1
    rounding = 8
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(13, 13, 13, 1.0)
    font_color = rgba(235, 235, 235, 1.0)
    check_color = rgba(200, 200, 200, 1.0)
    fail_color = rgba(120, 120, 120, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##777777">Senha</span>
    fail_text = <span foreground="##aaaaaa">$FAIL</span>
    position = 0, -20
    halign = center
    valign = center
}
